name: Build podcast feed

on:
  schedule:
    - cron: "5 * * * *"      # ogni ora al minuto 5 (UTC): pubblica gli episodi arrivati all'orario
  push:
    paths: ["episodes.json", "podcast.json", "build_feed.py"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_feed.py
      - name: Commit feed.xml se cambiato
        run: |
          if [ -n "$(git status --porcelain feed.xml)" ]; then
            git config user.name "stitches-bot"
            git config user.email "actions@users.noreply.github.com"
            git add feed.xml
            git commit -m "Update feed.xml"
            git pull --rebase
            git push
          fi
